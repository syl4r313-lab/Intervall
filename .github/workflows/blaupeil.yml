name: BlauPeil prüfen und APK bauen

on:
  push:
    paths:
      - 'blaupeil/**'
      - '.github/workflows/blaupeil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blaupeil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Pakete holen
        run: flutter pub get

      - name: Statische Analyse
        run: flutter analyze

      - name: Unit-Tests
        run: flutter test

      - name: APK bauen
        run: flutter build apk --release

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: blaupeil-apk
          path: blaupeil/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
